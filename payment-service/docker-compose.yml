services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - payment-store:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies the migrations, then exits. Same step as the deployment pipeline
  # (.github/workflows/migrate.yml): the service itself never migrates on startup.
  migrate:
    build: .
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: npm run db:migrate
    depends_on:
      db:
        condition: service_healthy

  # Local development only: loads the dummy data of db/seeds, then exits. Seeds refuse
  # to run with APP_ENV=production, the image's default.
  seed:
    build: .
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: npm run db:seed
    depends_on:
      migrate:
        condition: service_completed_successfully

  payment-service:
    build: .
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYMENT_STORE: postgres
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  payment-store:
