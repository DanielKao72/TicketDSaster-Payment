name: CI

# Push to main too: scripts/bump.sh only tags a main commit with a green run of this workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: payment-service

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: "checkout code"
        uses: actions/checkout@v7

      - name: "Setup node js"
        uses: actions/setup-node@v5
        with:
          node-version-file: payment-service/.nvmrc
          cache: npm
          cache-dependency-path: payment-service/package-lock.json

      - name: "install dependencies"
        run: npm ci

      - name: "audit dependencies"
        run: npm audit --audit-level=high

      - name: "lint"
        run: npm run lint

      - name: "tests"
        run: npm test

      - name: "build docker image"
        run: docker build -t payment-service:ci .

  # Migrations run as their own step, exactly as in the deployment pipeline
  # (.github/workflows/migrate.yml): applied from scratch, fully rolled back and applied
  # again, so a broken up or down fails here and not in a deploy. It also checks that
  # seeds refuse to run in production.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payment_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment -d payment_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://payment:payment@localhost:5432/payment_store

    steps:
      - name: "checkout code"
        uses: actions/checkout@v7

      - name: "Setup node js"
        uses: actions/setup-node@v5
        with:
          node-version-file: payment-service/.nvmrc
          cache: npm
          cache-dependency-path: payment-service/package-lock.json

      - name: "install dependencies"
        run: npm ci

      - name: "apply migrations"
        run: APP_ENV=production npm run db:migrate

      - name: "seeds refuse to run in production"
        run: |
          if APP_ENV=production npm run db:seed; then
            echo "::error::db:seed ran with APP_ENV=production"
            exit 1
          fi

      - name: "roll back every migration and apply them again"
        run: |
          npx knex migrate:rollback --all
          APP_ENV=production npm run db:migrate

      - name: "seeds load in development"
        run: APP_ENV=development npm run db:seed

      # The tests that need a real Postgres: concurrency (no double charge, one active
      # payment per Session), audit guards, pool and timeouts. They migrate and wipe it.
      - name: "tests against Postgres"
        run: TEST_DATABASE_URL="$DATABASE_URL" npm test

  # The Postman suite (51 requests, payment-service/postman/) against the service built
  # and run as a container, with its Postgres, migrations and dev seeds, exactly like
  # `docker compose up --build` locally.
  postman:
    runs-on: ubuntu-latest

    steps:
      - name: "checkout code"
        uses: actions/checkout@v7

      - name: "Setup node js"
        uses: actions/setup-node@v5
        with:
          node-version-file: payment-service/.nvmrc

      - name: "start the service with docker compose"
        run: |
          cp .env.example .env
          docker compose up --build --detach

      - name: "wait until the service is healthy"
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:3000/health > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The service did not answer /health within 2 minutes"
          docker compose ps --all
          exit 1

      - name: "run the Postman suite with newman"
        run: |
          JWT_SECRET="$(grep '^JWT_SECRET=' .env | cut -d= -f2-)"
          npx --yes newman@6.2.3 run postman/PaymentService.postman_collection.json \
            --environment postman/Local.postman_environment.json \
            --env-var "baseUrl=http://localhost:3000" \
            --env-var "jwtSecret=${JWT_SECRET}" \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - name: "service logs"
        if: failure()
        run: docker compose logs

      - name: "upload the newman report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: payment-service/newman-report.xml
          if-no-files-found: ignore

      - name: "stop the containers"
        if: always()
        run: docker compose down --volumes
