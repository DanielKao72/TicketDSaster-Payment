name: Release

# Tags are created with scripts/bump.sh (see README > Releases).
on:
  push:
    tags:
      - "v*.*.*"

# Each job asks for exactly what it needs.
permissions:
  contents: read

jobs:
  # Builds the image and pushes it to the registry inside the tailnet.
  # Needs the TS_OAUTH_CLIENT_ID, TS_OAUTH_AUDIENCE, REGISTRY_USER and REGISTRY_PASS secrets.
  # TODO: the deploy job that follows must run the migrations first, with
  # `uses: ./.github/workflows/migrate.yml` (seeds never run there), and only then roll out.
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login to Tailscale

    env:
      REGISTRY_HOST: gateway.tail9a6ddb.ts.net # Tailscale MagicDNS name
      REGISTRY: gateway.tail9a6ddb.ts.net:5000
      IMAGE_NAME: ninjava-payment-service

    steps:
      - name: "checkout code"
        uses: actions/checkout@v7

      # The registry speaks plain HTTP inside the tailnet (WireGuard encrypts the traffic).
      # Merged into the existing daemon.json, if any, instead of replacing it.
      - name: "Allow the tailnet registry over HTTP"
        shell: bash # adds pipefail: a jq error must fail the step
        run: |
          current=$(sudo cat /etc/docker/daemon.json 2>/dev/null || true)
          [[ -n "$current" ]] || current='{}'
          jq --arg registry "$REGISTRY" '."insecure-registries" += [$registry]' <<< "$current" \
            | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker

      # The "docker" driver builds and pushes through the daemon, which reads daemon.json.
      # The default docker-container driver runs BuildKit in its own container and ignores it.
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: "Docker metadata"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # "latest" is added automatically for stable versions, never for alpha/beta.
          # No major-only tag below 1.0: a "0" tag would span breaking changes.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      # Built before joining the tailnet: the build runs npm ci, and third-party
      # install scripts shouldn't be able to reach it.
      - name: "Build image"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: payment-service
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: "Join the tailnet"
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_OAUTH_AUDIENCE }}
          tags: tag:ci
          ping: ${{ env.REGISTRY_HOST }} # fails here, clearly, if the registry is unreachable

      # Passes the secrets as inputs, not pasted into a script; logs out when the job ends.
      - name: "Login to registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: "Push image"
        run: docker push --all-tags "$REGISTRY/$IMAGE_NAME"

  github-release:
    needs: docker-image # no GitHub release unless the image was published
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release

    steps:
      - name: "checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags: the changelog reads commits since the previous release

      - name: "Build changelog"
        # No pipe into tee: steps run without pipefail, so a failing script would pass unnoticed.
        run: |
          bash scripts/changelog.sh "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md

      - name: "Setup node js"
        uses: actions/setup-node@v5
        with:
          node-version-file: payment-service/.nvmrc
          cache: npm
          cache-dependency-path: payment-service/package-lock.json

      - name: "Install dependencies"
        working-directory: payment-service
        run: npm ci

      - name: "Generate OpenAPI spec"
        working-directory: payment-service
        run: APP_VERSION="${GITHUB_REF_NAME#v}" npm run openapi

      - name: "Release openapi def"
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: payment-service/openapi.json
          fail_on_unmatched_files: true
